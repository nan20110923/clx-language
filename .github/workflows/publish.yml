# Publishes the extension to the VS Code Marketplace.
# The Marketplace "Trusted Publishing" policy must name this file (publish.yml):
# https://marketplace.visualstudio.com/manage/publishers
#
# Two ways to publish, both gated on the same checks:
#
#   Tag   (preferred)  `v<version>`         -> stable
#                      `v<version>-rc.<n>`  -> pre-release
#   Manual             workflow_dispatch with `pre_release`
#
# The tag form is preferred because a tag is immutable and names the exact
# commit. A manual dispatch leaves no such anchor, so after the fact there is
# no version-controlled record of which commit produced a build.
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to publish to"
        type: choice
        options:
          - stable
          - pre-release
        default: stable

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Write is needed to attach the built vsix to a GitHub Release. Reading
      # alone was enough while this job only pushed to the Marketplace.
      contents: write
      # Lets the job request the OIDC token that vsce exchanges for a Marketplace session.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile

      # Resolve the channel and validate the tag in one place, so the publish
      # steps below stay free of branching logic.
      #
      # `package.json` cannot carry a `-rc` suffix: vsce rejects any version
      # with a semver prerelease part, and the pre-release channel is signalled
      # by the vsix's `preRelease` property instead. So the channel has to come
      # from the tag name, and the tag may carry a `-rc.N` suffix that the
      # version does not.
      - name: Resolve the channel from the tag
        id: channel
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            version="$(node -p "require('./package.json').version")"

            # Accept `v<version>` or `v<version>-rc.<n>`; nothing else.
            # bash's own `=~` is used instead of grep so the pattern's leading
            # dash is never mistaken for an option.
            if [[ ! "$tag" =~ ^v"$version"(-rc\.[0-9]+)?$ ]]; then
              echo "::error title=Version mismatch::tag is $tag but package.json says v$version. Expected v$version or v$version-rc.<n>. Bump the version, commit, then recreate the tag."
              exit 1
            fi

            if [[ "$tag" =~ -rc\.[0-9]+$ ]]; then
              channel=pre-release
            else
              channel=stable
            fi
            echo "channel=$channel" >> "$GITHUB_OUTPUT"
            echo "Tag $tag maps to the $channel channel."
          else
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          fi

      # Publishing used to skip every check: build.yml gates non-main branches,
      # so a tag pushed straight from main went to the Marketplace unverified.
      # Run the same gates here so a tag cannot ship something that would have
      # failed on a branch.
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      - run: yarn check-public --history

      # Build the vsix here so the same file is both checked and published.
      # `--pre-release` has to be decided at packaging time, not publishing
      # time: vsce records `Microsoft.VisualStudio.Code.PreRelease` inside the
      # vsix manifest, and `vsce publish --packagePath --pre-release` refuses a
      # package that does not carry it. `yarn package` cannot pass the flag, so
      # the channel is applied to the vsce invocation directly.
      - name: Check what the package will contain
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          if [ "$CHANNEL" = 'pre-release' ]; then
            npx @vscode/vsce package --no-dependencies --pre-release --out .artifacts/
          else
            yarn package
          fi
          vsix=$(ls .artifacts/*.vsix)
          listing=$(unzip -l "$vsix" | awk '{print $4}' | grep -v '^$')

          missing=0
          for required in \
            extension/dist/extension.js \
            extension/res/emulator-manifest.json \
            extension/res/luals-manifest.json \
            extension/res/luals/clx.lua \
            extension/res/clx-std/en/graphics.lua \
            extension/res/clx-std/zh/graphics.lua \
            extension/res/clx-lua/en/globals.lua \
            extension/readme.md \
            extension/syntaxes/.tmLanguage.json
          do
            if ! echo "$listing" | grep -qxF "$required"; then
              echo "::error title=Missing from vsix::$required is not in the package"
              missing=1
            fi
          done

          allowed='^extension/(dist/|res/|syntaxes/|snippets/|language-configuration\.json$|readme\.md$|readme_zh\.md$|README_zh\.md$|changelog\.md$|CHANGELOG\.md$|LICENSE\.txt$|package\.json$)'

          unexpected=$(echo "$listing" | grep '^extension/' | grep -vE "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "::error title=Unexpected file in vsix::Not in the allowlist. Either exclude it in .vscodeignore, or add it to the allowlist above if it is meant to ship:"
            echo "$unexpected"
            missing=1
          fi

          [ "$missing" -eq 0 ] || exit 1
          echo "Package contents are correct (allowlist)." >> "$GITHUB_STEP_SUMMARY"

      # A pre-release and a regular release can never share a version number
      # *within the same channel*, so the same version can appear once as
      # pre-release and once as stable — the stable one supersedes it.
      #
      # Both channels publish the vsix that `yarn package` already produced
      # above, instead of letting vsce build its own. One build means the file
      # on the Marketplace and the file on the GitHub Release are the same
      # bytes, and it is the only way the Release copy can be verified against
      # the allowlist that ran a step earlier.
      # Resolve the vsix once so every step below uses the same file. A glob
      # would pass several paths to vsce if a stale vsix ever survived into
      # `.artifacts/`, and vsce would then publish whichever it picked.
      - name: Locate the built vsix
        id: vsix
        shell: bash
        run: |
          mapfile -t found < <(ls .artifacts/*.vsix 2>/dev/null || true)
          if [ "${#found[@]}" -ne 1 ]; then
            echo "::error title=Expected exactly one vsix::Found ${#found[@]} in .artifacts/. Clear the directory and repackage."
            printf '%s\n' "${found[@]}"
            exit 1
          fi
          echo "path=${found[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${found[0]}")" >> "$GITHUB_OUTPUT"
          echo "Using $(basename "${found[0]}")" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish pre-release
        if: steps.channel.outputs.channel == 'pre-release'
        run: npx @vscode/vsce publish --no-dependencies --oidc --pre-release --packagePath "${{ steps.vsix.outputs.path }}"

      - name: Publish release
        if: steps.channel.outputs.channel == 'stable'
        run: npx @vscode/vsce publish --no-dependencies --oidc --packagePath "${{ steps.vsix.outputs.path }}"

      # Keep the built vsix reachable for anyone who wants to install it by
      # hand (for example on Windows, where the emulator cannot be tested in
      # CI). This runs after publishing on purpose: a Marketplace failure
      # should fail the job before it looks like a successful release.
      #
      # The release is tagged with the same tag that triggered the run, so the
      # vsix is permanently tied to the commit that produced it. `--verify-tag`
      # would fail for a manual dispatch, which has no tag, hence the guard.
      - name: Attach the vsix to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vsix='${{ steps.vsix.outputs.path }}'
          version=$(node -p "require('./package.json').version")
          channel='${{ steps.channel.outputs.channel }}'

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            # A manual dispatch leaves no tag behind. Name the release after
            # the version and channel so it is still identifiable, and mark
            # pre-releases as such.
            tag="v$version"
          fi

          notes="VSIX for clx-language $version ($channel), built from $GITHUB_SHA."
          prerelease=''
          if [ "$channel" = 'pre-release' ]; then
            prerelease='--prerelease'
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$vsix" --clobber
          else
            gh release create "$tag" "$vsix" \
              --title "clx-language $version" \
              --notes "$notes" \
              $prerelease
          fi

          echo "Attached $(basename "$vsix") to release $tag." >> "$GITHUB_STEP_SUMMARY"
