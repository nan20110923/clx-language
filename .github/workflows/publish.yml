# Publishes the extension to the VS Code Marketplace.
# The Marketplace "Trusted Publishing" policy must name this file (publish.yml):
# https://marketplace.visualstudio.com/manage/publishers
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      pre_release:
        description: "Publish as a pre-release (users must opt in to install it)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the job request the OIDC token that vsce exchanges for a Marketplace session.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile

      - name: Check that the tag matches the version in package.json
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error title=Version mismatch::tag is $GITHUB_REF_NAME but package.json says $expected. Bump the version, commit, then move or recreate the tag."
            exit 1
          fi

      # A pre-release and a regular release can never share a version number,
      # so a version published as pre-release needs a different one to go stable.
      - name: Publish pre-release
        if: inputs.pre_release
        run: npx @vscode/vsce publish --no-dependencies --oidc --pre-release

      - name: Publish release
        if: ${{ !inputs.pre_release }}
        run: npx @vscode/vsce publish --no-dependencies --oidc
