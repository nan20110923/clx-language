# Builds a VSIX for manual testing. Does NOT publish anything.
#
# Use this to test a change (for example on Windows) before bumping the version:
# run it, download the "vsix" artifact from the run page, then
#   code --install-extension clx-language-<version>.vsix
# Re-running it on the same commit does not consume a version number.
name: Build VSIX

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      # 这个仓库是 public：确认没有把本机路径、内网地址或凭据提交进来。
      # 顺带扫整个 git 历史 —— 工作区干净不代表历史干净，而历史改不掉。
      - run: yarn check-public --history
      # vscode:prepublish runs automatically and bundles src/ into dist/
      - run: yarn package

      - name: Report what went into the package
        run: |
          vsix=$(ls .artifacts/*.vsix)
          echo "### $(basename "$vsix")" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$vsix" | tail -2 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$vsix" | awk '{print $4}' | grep -E 'emulator-manifest|readme|dist/' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # .vscodeignore 是唯一决定出厂内容的 interface。历史上它漏过 src/**，把
      # 13 个 .ts 和一份 tsconfig.json 发了出去（1.0.17 里还有整套 out/ 示例），
      # 而这里的检查只 grep 了 emulator-manifest|readme，所以一直没被发现。
      # 出厂内容是**白名单**，不是黑名单。
      #
      # 历史上这里是 grep 'src/|out/|tsconfig.json' 的黑名单，两次漏过东西：
      # 1.0.17 漏了 src/ 和 out/；随后 test/ 和 eslint.config.mjs 又漏了，
      # 当时的"修法"是把它们补进正则。每次加文件都要记得改正则，一定会再漏。
      #
      # 现在反过来断言：extension/ 下只允许下列前缀。新增一个本该发布的目录时
      # 要显式加到这里，否则 CI 失败 —— 失败点落在新文件上，而不是等到用户
      # 在插件包里看见源码。
      - name: Check the package contains only what should ship
        run: |
          vsix=$(ls .artifacts/*.vsix)
          listing=$(unzip -l "$vsix" | awk '{print $4}' | grep -v '^$')

          missing=0
          for required in \
            extension/dist/extension.js \
            extension/res/emulator-manifest.json \
            extension/res/luals-manifest.json \
            extension/res/luals/clx.lua \
            extension/res/clx-std/en/graphics.lua \
            extension/res/clx-std/zh/graphics.lua \
            extension/res/clx-lua/en/globals.lua \
            extension/readme.md \
            extension/syntaxes/.tmLanguage.json
          do
            if ! echo "$listing" | grep -qxF "$required"; then
              echo "::error title=Missing from vsix::$required is not in the package"
              missing=1
            fi
          done

          # extension/ 下允许的路径前缀。文件和目录都列出来，别用宽前缀。
          # 注意 res/ 是宽前缀：它下面既有要发布的存根，也是唯一放过"新增目录"
          # 的地方。新增 res/ 子目录时请同时加一条 required 断言，否则打错路径
          # 的文件会被静默放过（这正是 allowlist 当初要防的漏法）。
          allowed='^extension/(dist/|res/|syntaxes/|snippets/|language-configuration\.json$|readme\.md$|readme_zh\.md$|README_zh\.md$|changelog\.md$|CHANGELOG\.md$|LICENSE\.txt$|package\.json$)'

          unexpected=$(echo "$listing" | grep '^extension/' | grep -vE "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "::error title=Unexpected file in vsix::These are not in the allowlist. Either exclude them in .vscodeignore, or add them to the allowlist above if they are meant to ship:"
            echo "$unexpected"
            missing=1
          fi

          [ "$missing" -eq 0 ] || exit 1
          echo "Package contents are correct (allowlist)." >> "$GITHUB_STEP_SUMMARY"

      # `.artifacts/` 以点开头，而 upload-artifact@v4 默认不包含隐藏文件
      # （include-hidden-files 默认 false）。缺了这一行，上面的步骤都成功、
      # 产物也确实生成了，但上传时找不到文件而失败。
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ".artifacts/*.vsix"
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
