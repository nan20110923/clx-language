# Builds a VSIX for manual testing. Does NOT publish anything.
#
# Use this to test a change (for example on Windows) before bumping the version:
# run it, download the "vsix" artifact from the run page, then
#   code --install-extension clx-language-<version>.vsix
# Re-running it on the same commit does not consume a version number.
name: Build VSIX

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      # vscode:prepublish runs automatically and bundles src/ into dist/
      - run: yarn package

      - name: Report what went into the package
        run: |
          vsix=$(ls *.vsix)
          echo "### $vsix" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$vsix" | tail -2 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$vsix" | awk '{print $4}' | grep -E 'emulator-manifest|readme' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 30
