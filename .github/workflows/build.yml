# Builds a VSIX for manual testing. Does NOT publish anything.
#
# Use this to test a change (for example on Windows) before bumping the version:
# run it, download the "vsix" artifact from the run page, then
#   code --install-extension clx-language-<version>.vsix
# Re-running it on the same commit does not consume a version number.
name: Build VSIX

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test
      # vscode:prepublish runs automatically and bundles src/ into dist/
      - run: yarn package

      - name: Report what went into the package
        run: |
          vsix=$(ls .artifacts/*.vsix)
          echo "### $(basename "$vsix")" >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$vsix" | tail -2 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -l "$vsix" | awk '{print $4}' | grep -E 'emulator-manifest|readme|dist/' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # .vscodeignore 是唯一决定出厂内容的 interface。历史上它漏过 src/**，把
      # 13 个 .ts 和一份 tsconfig.json 发了出去（1.0.17 里还有整套 out/ 示例），
      # 而这里的检查只 grep 了 emulator-manifest|readme，所以一直没被发现。
      - name: Check nothing that must not ship is in the package
        run: |
          vsix=$(ls .artifacts/*.vsix)
          listing=$(unzip -l "$vsix" | awk '{print $4}')

          missing=0
          for required in \
            extension/dist/extension.js \
            extension/res/emulator-manifest.json \
            extension/server/lua_ls.jar \
            extension/readme.md \
            extension/syntaxes/.tmLanguage.json
          do
            if ! echo "$listing" | grep -qxF "$required"; then
              echo "::error title=Missing from vsix::$required is not in the package"
              missing=1
            fi
          done

          leaked=$(echo "$listing" | grep -E '^extension/(src/|test/|out/|tsconfig\.json$|eslint\.config\.mjs$)' || true)
          if [ -n "$leaked" ]; then
            echo "::error title=Source leaked into vsix::These must be excluded by .vscodeignore:"
            echo "$leaked"
            missing=1
          fi

          [ "$missing" -eq 0 ] || exit 1
          echo "Package contents are correct." >> "$GITHUB_STEP_SUMMARY"

      # `.artifacts/` 以点开头，而 upload-artifact@v4 默认不包含隐藏文件
      # （include-hidden-files 默认 false）。缺了这一行，上面的步骤都成功、
      # 产物也确实生成了，但上传时找不到文件而失败。
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ".artifacts/*.vsix"
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
